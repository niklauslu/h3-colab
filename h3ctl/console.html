<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>H3 控制台</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --ok:#4ade80; --bad:#f87171; --dim:#8b93a3; --acc:#7aa2f7; }
  body { background:var(--bg); color:#e6e9ef; font:14px/1.6 -apple-system,"PingFang SC",sans-serif; margin:0; padding:24px; }
  h1 { font-size:18px; margin:0 0 4px; } .sub { color:var(--dim); font-size:12px; margin-bottom:20px; }
  .card { background:var(--card); border-radius:10px; padding:16px 18px; margin-bottom:14px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .phase { font-weight:600; } .ok { color:var(--ok); } .bad { color:var(--bad); } .dim { color:var(--dim); }
  input,select,textarea { background:#12141a; border:1px solid #2a2f3a; color:#e6e9ef; border-radius:6px; padding:7px 10px; font-size:13px; }
  textarea { width:100%; min-height:60px; resize:vertical; }
  button { background:var(--acc); color:#0b1020; border:0; border-radius:6px; padding:8px 16px; font-weight:600; cursor:pointer; }
  button.ghost { background:#2a2f3a; color:#e6e9ef; } button.danger { background:var(--bad); color:#111; }
  table { width:100%; border-collapse:collapse; font-size:13px; } td,th { padding:6px 8px; text-align:left; border-bottom:1px solid #262b36; }
  .bar { height:6px; background:#12141a; border-radius:3px; overflow:hidden; margin-top:6px; }
  .bar>i { display:block; height:100%; background:var(--acc); transition:width .5s; }
  a { color:var(--acc); text-decoration:none; }
</style>
</head>
<body>
<h1>H3 控制台 <span class="dim">— 薄视图, agent 走直连契约</span></h1>
<div class="sub">数据: VM 外壳 /state 轮询 2s · 操作经本地反代 · 收工请用 CLI(危险操作不进面板)</div>

<div class="card">
  <div class="row">
    <span>外壳: <b id="phase" class="dim">…</b></span>
    <span id="detail" class="dim"></span>
  </div>
</div>

<div class="card">
  <b>生成</b>
  <div class="row" style="margin:10px 0">
    <select id="mode"><option value="t2v">t2v 文生视频</option><option value="fl2v">fl2v 首尾帧</option><option value="ref2v">ref2v 人物参考</option></select>
    <input id="seed" type="number" value="42" style="width:90px" title="seed">
    <input id="seconds" type="number" value="5" step="1" min="4" max="15" style="width:70px" title="秒">
    <input id="name" placeholder="产出名(可空)" style="width:140px">
    <button id="go">生成</button>
  </div>
  <textarea id="prompt" placeholder="提示词…"></textarea>
  <div class="dim" style="margin-top:6px" id="hint">fl2v / ref2v 需先在 CLI 传素材(h3ctl gen --keyframe/--ref); 面板 v0.4 只做 T2V 快捷。</div>
</div>

<div class="card">
  <b>任务</b>
  <div id="jobs" class="dim" style="margin-top:8px">暂无任务</div>
</div>

<script>
const $ = id => document.getElementById(id);
async function tick() {
  try {
    const r = await fetch('/api/state'); const st = await r.json();
    const p = $('phase'); p.textContent = st.phase || 'down';
    p.className = st.phase === 'ready' ? 'phase ok' : 'phase bad';
    $('detail').textContent = st.phase_detail || '';
    const jobs = Object.entries(st.jobs || {});
    if (!jobs.length) { $('jobs').textContent = '暂无任务'; return; }
    $('jobs').innerHTML = '<table><tr><th>job</th><th>状态</th><th>进度</th><th>耗时</th></tr>' +
      jobs.map(([id, j]) => {
        const pct = (j.progress && j.progress.pct_est) || 0;
        return `<tr><td>${id.slice(0,8)}</td><td>${j.state||''}</td>` +
          `<td><div class="bar"><i style="width:${pct}%"></i></div></td>` +
          `<td class="dim">${Math.round(j.elapsed_s||0)}s</td></tr>`;
      }).join('') + '</table>';
  } catch (e) { $('phase').textContent = 'down'; $('phase').className = 'phase bad'; }
}
$('go').onclick = async () => {
  const spec = { mode: $('mode').value, prompt: $('prompt').value,
    seed: +$('seed').value, seconds: +$('seconds').value, name: $('name').value || undefined };
  if (!spec.prompt) return;
  const r = await fetch('/api/generate', { method:'POST', body: JSON.stringify(spec) });
  const j = await r.json().catch(() => ({}));
  if (r.status === 202) tick(); else $('hint').textContent = '提交被拒: ' + JSON.stringify(j);
};
tick(); setInterval(tick, 2000);
</script>
</body>
</html>
